[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpricer"
version = "0.1.0"
description = "A learning-oriented Monte Carlo options pricing engine"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["mcpricer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
